apiVersion: apps/v1
kind: Deployment

metadata:
  name: canary-v1

spec:
  replicas: 9

  selector:
    matchLabels:
      app: canary-demo
      version: v1

  template:

    metadata:
      labels:
        app: canary-demo
        version: v1

    spec:

      containers:

      - name: app

        image: yashamin62/devops-module12:1

        env:

        - name: VERSION
          value: "v1"

        - name: FEATURE_ENABLED
          value: "false"

        ports:
        - containerPort: 3000
---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: canary-v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: canary-demo
      version: v2

  template:

    metadata:
      labels:
        app: canary-demo
        version: v2

    spec:

      containers:

      - name: app

        image: yashamin62/devops-module12:2

        env:

        - name: VERSION
          value: "v2"

        - name: FEATURE_ENABLED
          value: "true"

        ports:
        - containerPort: 3000
---

apiVersion: v1
kind: Service

metadata:
  name: canary-service

spec:

  type: NodePort

  selector:
    app: canary-demo

  ports:

  - port: 3000
    targetPort: 3000
    nodePort: 30081
